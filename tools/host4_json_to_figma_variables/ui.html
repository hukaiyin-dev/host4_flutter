<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      background-color: #f5f5f5;
    }
    #drop-zone {
      flex: 1;
      border: 2px dashed #ccc;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      color: #666;
      transition: all 0.2s ease;
      cursor: pointer;
      background: white;
    }
    #drop-zone.hover {
      border-color: #18A0FB;
      background-color: #e8f5fe;
      color: #18A0FB;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #333;
      white-space: pre-wrap;
      max-height: 80px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div id="drop-zone">
    <div>
      <div>📄</div>
      <p>拖入 tokens.json</p>
      <p style="font-size: 11px; opacity: 0.7;">或点击选择文件</p>
    </div>
  </div>
  <input type="file" id="file-input" style="display: none" accept=".json">
  <div id="status">准备就绪</div>
  
  <script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const status = document.getElementById('status');

    dropZone.onclick = () => fileInput.click();
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('hover'); };
    dropZone.ondragleave = () => dropZone.classList.remove('hover');
    dropZone.ondrop = (e) => { e.preventDefault(); dropZone.classList.remove('hover'); handleFile(e.dataTransfer.files[0]); };
    fileInput.onchange = (e) => handleFile(e.target.files[0]);

    function handleFile(file) {
      if (!file || !file.name.endsWith('.json')) {
        status.textContent = '❌ 请使用 .json 文件';
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const json = JSON.parse(e.target.result);
          parent.postMessage({ pluginMessage: { type: 'process-tokens', data: json } }, '*');
        } catch (err) { status.textContent = '❌ JSON 格式错误: ' + err.message; }
      };
      reader.readAsText(file);
    }

    onmessage = (event) => {
      if (event.data.pluginMessage.type === 'status') {
        status.textContent = event.data.pluginMessage.text;
      }
    };
  </script>
</body>
</html>
