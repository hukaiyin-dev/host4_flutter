source:
  target_image_path: packages/host4_flutter_download/example/test/goldens/download_playground_multi_task_portrait.png
device_profile:
  platform: ios
  width_px: 393
  height_px: 852
  pixel_ratio: 3
assertions:
  - task list visible
  - no text overlap
  - per-task controls remain scoped to their task item
  - long URL, path, and sha256 text wraps without covering controls
thresholds:
  layout_tolerance_px: 4
  spacing_tolerance_px: 4
  font_size_tolerance_px: 1
  color_delta_e: 3
  screenshot_match_threshold: 0.98
stable_identifiers:
  - download_playground.url_input
  - download_playground.add_button
  - download_playground.task_list
  - download_playground.task_item
  - download_playground.task_status
  - download_playground.task_progress
  - download_playground.task_pause_button
  - download_playground.task_resume_button
  - download_playground.task_cancel_button
  - download_playground.task_clear_button
  - download_playground.file_path
  - download_playground.clear_completed_button
