name: host4_flutter_emulator_ui
description: Shared Flutter controls and save UI for Host4 emulators.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  display_metrics: ^2.3.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.14

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/controls/
    - assets/key_locator/
    - assets/layout_picker/
