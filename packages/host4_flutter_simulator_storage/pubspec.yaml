name: host4_flutter_simulator_storage
description: "Reusable simulator ROM storage scanning helpers for Host4 apps."
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: Host4FlutterSimulatorStoragePlugin
